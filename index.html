<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weaveborn — The Loom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Design tokens — light (default) and dark
=========================================================== */
:root {
  --bg: #eef1e7;
  --bg-panel: #ffffff;
  --bg-panel-alt: #e4e8da;
  --thread: #c7ccba;
  --thread-strong: #a7ae98;
  --ink: #262a22;
  --ink-dim: #666e5d;
  --accent: #9c7419;
  --accent-ink: #2a1f08;
  --accent-glow: #f1dda0;
  --harm: #a8402f;
  --strain: #3d6c8a;
  --good: #4d7a48;

  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-body: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b;
    --bg-panel: #1b1e25;
    --bg-panel-alt: #21242c;
    --thread: #383d49;
    --thread-strong: #4c5261;
    --ink: #e9e6da;
    --ink-dim: #9aa0a6;
    --accent: #f0c14b;
    --accent-ink: #1c1503;
    --accent-glow: #fbe7ab;
    --harm: #dd8171;
    --strain: #8ab2d4;
    --good: #93c47f;
  }
}

:root[data-theme="dark"] {
  --bg: #14161b;
  --bg-panel: #1b1e25;
  --bg-panel-alt: #21242c;
  --thread: #383d49;
  --thread-strong: #4c5261;
  --ink: #e9e6da;
  --ink-dim: #9aa0a6;
  --accent: #f0c14b;
  --accent-ink: #1c1503;
  --accent-glow: #fbe7ab;
  --harm: #dd8171;
  --strain: #8ab2d4;
  --good: #93c47f;
}

/* ===========================================================
   Base
=========================================================== */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  background-image:
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--thread) 35%, transparent) 0 1px, transparent 1px 96px),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--thread) 35%, transparent) 0 1px, transparent 1px 96px);
  background-attachment: fixed;
}

#app {
  max-width: 640px;
  margin: 0 auto;
  padding: 32px 20px 96px;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; color: var(--ink); margin: 0 0 8px; }
h1 { font-size: 2rem; line-height: 1.08; }
h2 { font-size: 1.25rem; margin-top: 0; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 8px; }

button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: 1rem; color: var(--ink); accent-color: var(--accent); }

::selection { background: var(--accent-glow); color: var(--accent-ink); }

/* ===========================================================
   Buttons
=========================================================== */
.btn {
  font-size: 0.95rem;
  padding: 10px 18px;
  border: 1px solid var(--thread-strong);
  background: var(--bg-panel);
  color: var(--ink);
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.05); }

.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { border-color: var(--thread-strong); }

.btn-danger { color: var(--harm); }
.btn-danger:hover { border-color: var(--harm); }
.btn-danger-solid { background: var(--harm); border-color: var(--harm); color: #fff; font-weight: 600; }
.btn-danger-solid:hover { filter: brightness(1.08); }
.confirm-delete-text { font-size: 0.85rem; color: var(--ink-dim); align-self: center; }

.btn-new { display: block; width: 100%; margin: 28px 0 8px; padding: 14px; font-size: 1.02rem; }
.btn-pun { white-space: nowrap; }

/* ===========================================================
   Home / Loom
=========================================================== */
.home-header { margin-bottom: 24px; }
.kicker {
  font-family: var(--font-display);
  font-style: italic;
  color: var(--accent);
  font-size: 1rem;
  margin-bottom: 2px;
}
.home-sub { color: var(--ink-dim); }

.empty-loom {
  border: 1px dashed var(--thread-strong);
  border-radius: 4px;
  padding: 40px 20px;
  text-align: center;
  color: var(--ink-dim);
}
.empty-loom-title { font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); margin-bottom: 4px; }
.empty-loom-body { margin: 0; }

.char-grid { display: flex; flex-direction: column; gap: 10px; }

.world-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 18px;
  background: var(--bg-panel-alt);
  border: 1px solid var(--thread);
  border-radius: 3px;
  cursor: pointer;
  color: var(--ink);
  font-size: 0.88rem;
}
.world-strip:hover { border-color: var(--accent); }
.world-strip-label { color: var(--ink-dim); }
.world-strip-value { font-weight: 700; }

.thread-pick-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.thread-pick-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-align: left;
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-panel);
  border: 1px solid var(--thread);
  border-left: 4px solid var(--accent);
  border-radius: 3px;
  cursor: pointer;
  color: var(--ink);
}
.thread-pick-card:hover { border-color: var(--accent); }
.thread-pick-card-active { background: color-mix(in srgb, var(--accent-glow) 30%, var(--bg-panel)); border-color: var(--accent); }
.thread-pick-name { font-family: var(--font-display); font-size: 1.15rem; }
.thread-pick-sub { font-size: 0.82rem; color: var(--ink-dim); }
.thread-pick-skills { font-size: 0.78rem; color: var(--accent); margin-top: 2px; }
.age-current-tag {
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--accent-ink);
  background: var(--accent);
  padding: 1px 7px;
  border-radius: 10px;
  vertical-align: middle;
  margin-left: 4px;
}
.optional-tag {
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--ink-dim);
  background: var(--bg-panel-alt);
  border: 1px solid var(--thread-strong);
  padding: 1px 7px;
  border-radius: 10px;
  vertical-align: middle;
  margin-left: 4px;
}

.char-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  text-align: left;
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-panel);
  border: 1px solid var(--thread);
  border-left: 4px solid var(--accent);
  border-radius: 3px;
  cursor: pointer;
  color: var(--ink);
}
.char-card:hover { border-color: var(--accent); }
.char-card-thread { font-size: 0.8rem; color: var(--ink-dim); }
.char-card-name { font-family: var(--font-display); font-size: 1.15rem; }
.char-card-status { display: flex; gap: 14px; font-size: 0.85rem; color: var(--ink-dim); }
.pip-bad { color: var(--harm); font-weight: 700; }

.storage-note { margin-top: 20px; font-size: 0.8rem; color: var(--ink-dim); text-align: center; }

/* ===========================================================
   Wizard
=========================================================== */
.step-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--thread);
}
.step-tab { font-size: 0.85rem; color: var(--ink-dim); }
.step-tab-active { color: var(--accent); font-weight: 700; }
.step-tab-done { color: var(--ink); }

.wiz-section {
  margin-bottom: 30px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--thread);
}
.wiz-section:last-child { border-bottom: none; }
.wiz-hint { color: var(--ink-dim); font-size: 0.92rem; }

.field-label { display: block; font-size: 0.85rem; color: var(--ink-dim); margin-bottom: 6px; }
.name-row { display: flex; gap: 10px; flex-wrap: wrap; }
.text-input {
  flex: 1 1 220px;
  padding: 10px 12px;
  border: 1px solid var(--thread-strong);
  border-radius: 3px;
  background: var(--bg-panel);
  color: var(--ink);
}
.text-input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.section-head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.section-head-row h2 { margin-bottom: 0; }
.btn-random { font-size: 0.85rem; padding: 6px 12px; white-space: nowrap; }

.formative-subhead { color: var(--ink-dim); font-size: 0.85rem; margin: 14px 0 6px; }
.formative-subhead-burden { color: var(--harm); }
.formative-text { line-height: 1.4; }

.radio-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.radio-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--thread);
  border-radius: 3px;
  background: var(--bg-panel);
  cursor: pointer;
}
.radio-row-checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent-glow) 35%, var(--bg-panel)); }
.pair-slash { color: var(--ink-dim); padding: 0 2px; }

.pool-status { font-size: 0.88rem; color: var(--accent); font-weight: 600; margin-bottom: 14px; }
.age-note { font-size: 0.85rem; color: var(--ink-dim); font-style: italic; margin: -4px 0 14px; }

.axis-row, .style-row { margin-bottom: 18px; }
.axis-row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.axis-label { font-family: var(--font-display); font-size: 1.05rem; }
.axis-hint { color: var(--ink-dim); font-size: 0.85rem; margin-bottom: 6px; }
.axis-note { color: var(--ink-dim); font-size: 0.85rem; font-style: italic; }

.style-examples { margin: 6px 0 0; padding-left: 20px; }
.style-examples li { font-size: 0.82rem; color: var(--ink-dim); line-height: 1.4; margin-bottom: 2px; }
.style-card-sheet { cursor: default; }
.style-card-sheet:hover { border-color: var(--thread); }
.style-card-sheet .style-examples { margin-top: 8px; }

.pool-select {
  padding: 6px 10px;
  border: 1px solid var(--thread-strong);
  border-radius: 3px;
  background: var(--bg-panel);
  color: var(--ink);
  min-width: 64px;
  text-align: center;
  font-weight: 700;
}

.axis-current-text { font-size: 0.9rem; color: var(--ink); margin: 2px 0 0; font-style: italic; }

.skill-list { display: flex; flex-direction: column; gap: 4px; }
.skill-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--thread);
}
.skill-row:last-child { border-bottom: none; }
.skill-name-wrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.skill-name { font-family: var(--font-display); }
.skill-desc { font-size: 0.76rem; color: var(--ink-dim); line-height: 1.25; }
.skill-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--ink-dim); white-space: nowrap; cursor: pointer; }
.skill-toggle-disabled { opacity: 0.35; cursor: not-allowed; }

.ability-list { display: flex; flex-direction: column; gap: 10px; }
.ability-row {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 10px;
  padding: 14px;
  border: 1px solid var(--thread);
  border-radius: 3px;
  background: var(--bg-panel);
  cursor: pointer;
}
.ability-row input { grid-row: 1 / span 3; margin-top: 3px; }
.ability-row-checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent-glow) 30%, var(--bg-panel)); }
.ability-name { font-family: var(--font-display); font-size: 1.05rem; }
.ability-body { color: var(--ink); font-size: 0.92rem; }
.ability-bonus { color: var(--accent); font-size: 0.88rem; font-weight: 600; }

.review-name { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 4px; }
.review-line { color: var(--ink-dim); }
.review-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.review-chip {
  font-size: 0.82rem;
  padding: 4px 10px;
  border: 1px solid var(--thread-strong);
  border-radius: 20px;
  color: var(--ink);
}

.wizard-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 16px;
  border-top: 1px solid var(--thread);
}
.wizard-footer-right { display: flex; gap: 10px; }

/* ===========================================================
   Sheet
=========================================================== */
.sheet-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
.sheet-topbar-actions { display: flex; gap: 8px; }

.sheet-header { margin-bottom: 26px; }
.sheet-aspiration { font-size: 1.02rem; }
.sheet-formative { color: var(--ink-dim); }

.sheet-section {
  margin-bottom: 26px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--thread);
}
.sheet-section:last-child { border-bottom: none; }
.sheet-subhead { margin-top: 18px; color: var(--ink-dim); font-size: 0.9rem; }

.track-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; padding-top: 14px; }
.track-label-wrap { position: relative; min-width: 60px; display: inline-flex; }
.track-label { font-weight: 700; }
.track-label-bad { color: var(--harm); }
.track-status-badge {
  position: absolute;
  top: -18px;
  left: 0;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #fff;
  background: var(--harm);
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
  animation: badge-pop 180ms ease;
  pointer-events: none;
}
@keyframes badge-pop {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.pip-track { display: flex; gap: 6px; }
.pip {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--thread-strong);
  background: transparent;
  cursor: pointer;
  padding: 0;
}
.pip-filled { background: var(--harm); border-color: var(--harm); }
.pip-threshold { box-shadow: 0 0 0 2px var(--bg) inset, 0 0 0 3px var(--ink-dim); }

/* Stepper buttons (Harm/Strain/Karma +/-) */
.stepper-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--thread-strong);
  background: var(--bg-panel);
  color: var(--ink);
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
}
.stepper-btn:hover { border-color: var(--accent); }
.stepper-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.track-count { font-size: 0.85rem; color: var(--ink-dim); min-width: 40px; }

/* Karma */
.karma-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.karma-label { font-family: var(--font-display); font-weight: 600; margin-right: 2px; }
.karma-value { font-family: var(--font-display); font-size: 1.3rem; color: var(--accent); min-width: 24px; text-align: center; }
.karma-hint { font-size: 0.82rem; color: var(--ink-dim); margin: 0 0 12px; }
.karma-staged-tag { color: var(--accent); font-weight: 700; }
.btn-roll { display: block; width: 100%; margin-bottom: 20px; }

/* Stat cards (Threadcraft, sheet view) — the whole card is the Karma-boost
   control; the debility pill and any focusable child intercept their own
   clicks via event delegation (closest() matches the nearer element). */
.stat-card-list { display: flex; flex-direction: column; gap: 8px; }
.stat-card {
  padding: 10px 12px;
  border: 1px solid var(--thread);
  border-radius: 3px;
  background: var(--bg-panel);
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}
.stat-card:hover { border-color: var(--accent); }
.stat-card:active { background: var(--bg-panel-alt); }
.stat-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stat-card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stat-card-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stat-card-label { font-family: var(--font-display); font-size: 1.02rem; }

.stat-card-total-wrap { display: flex; align-items: baseline; gap: 5px; flex-shrink: 0; }
.stat-card-total { font-family: var(--font-display); font-size: 1.45rem; color: var(--ink-dim); line-height: 1; }
.stat-card-total-modified { color: var(--accent); }
.stat-card-boost-tag {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent-glow) 55%, transparent);
  padding: 1px 6px;
  border-radius: 10px;
}

.stat-card-desc { margin: 4px 0 0; font-size: 0.85rem; color: var(--ink-dim); }

.debility-pill {
  font-size: 0.74rem;
  padding: 3px 9px;
  border: 1px solid var(--thread-strong);
  border-radius: 20px;
  background: transparent;
  color: var(--ink-dim);
  cursor: pointer;
  flex-shrink: 0;
}
.debility-pill-active { background: var(--harm); border-color: var(--harm); color: #fff; }

.sheet-axis-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.sheet-axis {
  flex: 1 1 150px;
  padding: 10px 12px;
  border: 1px solid var(--thread);
  border-radius: 3px;
  background: var(--bg-panel);
}
.sheet-axis-label { display: block; font-size: 0.8rem; color: var(--ink-dim); }
.sheet-axis-value { display: block; font-family: var(--font-display); font-size: 1.4rem; color: var(--accent); }
.sheet-axis-desc { display: block; font-size: 0.82rem; margin-top: 2px; }

.sheet-skill-grid { display: flex; flex-direction: column; gap: 2px; }
.sheet-skill {
  display: flex;
  justify-content: space-between;
  padding: 7px 12px;
  border-bottom: 1px solid var(--thread);
  font-size: 0.95rem;
}
.sheet-skill-expert { color: var(--accent); font-weight: 700; }
.sheet-skill-trained { color: var(--ink); font-weight: 600; }
.sheet-skill-untrained { color: var(--ink-dim); }

.sheet-ability-body { font-size: 0.98rem; }
.sheet-ability-bonus { color: var(--accent); font-weight: 600; }

.notes-area {
  width: 100%;
  min-height: 110px;
  padding: 10px 12px;
  border: 1px solid var(--thread-strong);
  border-radius: 3px;
  background: var(--bg-panel);
  color: var(--ink);
  resize: vertical;
}

/* ===========================================================
   Toast
=========================================================== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--ink);
  color: var(--bg);
  padding: 9px 18px;
  border-radius: 20px;
  font-size: 0.88rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}
.toast-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===========================================================
   Responsive
=========================================================== */
@media (max-width: 480px) {
  #app { padding: 22px 14px 90px; }
  h1 { font-size: 1.6rem; }
  .skill-row { grid-template-columns: 1fr; gap: 2px; }
  .track-label { min-width: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===========================================================
   WEAVEBORN — Playbook Loom
   Character creator + live play sheet, built to hold many
   Threads (playbooks). Only "Light" is defined for now.
=========================================================== */

/* ---------------- Playbook data ---------------- */

const SHARED_THREAD_DATA = {
  aspirations: [
    'Master my Thread.',
    'Protect my community.',
    'Protect someone important to me.',
    'Discover forbidden knowledge.',
    'Find the truth.',
    'Understand the Weave.',
    'Build something lasting.',
    'Change the world.',
    'Found a school.',
    'Pass my knowledge to the next generation.',
    'Destroy a rival faction.',
    'Defeat a great threat.',
    'Free those who are oppressed.',
    'Restore what was lost.',
    'Rebuild my home.',
    'Become free.',
    'Earn redemption.',
    'Fulfill a promise.',
    'Leave a legacy.',
    'Reach a place no one has reached before.'
  ],

  formativeExperiences: [
    { key: 'liberation', label: 'Liberation', desc: 'Someone freed you, your family, or your people from oppression.', polarity: 'inspiration' },
    { key: 'kindness', label: 'Kindness', desc: 'A stranger showed you compassion when they had no reason to.', polarity: 'inspiration' },

function coreSkillNames() {

function ageSkillNames(ageId) {
  const age = AGES[ageId];
  return age ? age.settingSkills.map(function (s) { return s.name; }) : [];
}

/* The full skill list a character creator/sheet should offer right now:
   Core + whatever the world's current Age adds, plus any already-chosen
   skill names that wouldn't otherwise appear (e.g. a character built
   under a since-changed Age keeps showing its actual pick rather than
   silently hiding it). */
function availableSkillList(world, extraNames) {
  let list = coreSkillNames();
  if (world && world.age) list = list.concat(ageSkillNames(world.age));
  (extraNames || []).forEach(function (n) {
    if (n && list.indexOf(n) === -1) list.push(n);
  });
  return list;
}

/* Looks up a skill's blurb: Core first, then the active Age, then falls
   back to searching every Age (covers a skill picked under a different
   Age than the one currently set). */
function skillDescription(name, activeAgeId) {
  const core = CORE_SKILLS.filter(function (s) { return s.name === name; })[0];
  if (core) return core.desc;
  const active = activeAgeId ? AGES[activeAgeId] : null;
  if (active) {
    const match = active.settingSkills.filter(function (s) { return s.name === name; })[0];
    if (match) return match.desc;
  }
  for (let i = 0; i < AGE_LIST.length; i++) {
    const age = AGES[AGE_LIST[i]];
    const match = age.settingSkills.filter(function (s) { return s.name === name; })[0];
    if (match) return match.desc;
  }
  return '';
}


/* ---------------- Storage abstraction ---------------- */
/* Characters prefer the `db` capability's private per-viewer docs under
   data/users/<id>/ (falling back to localStorage when db/user aren't
   available). The world's Age is a group-level decision, though — the
   whole table should see and be able to set the same one — so it lives
   at a SHARED path (world/settings) instead, visible and writable by
   anyone who opens this app, the same way the rest of the db capability's
   shared documents default to working. */

const Store = (function () {
  const LOCAL_CHAR_KEY = 'weaveborn_characters_v1';
  const LOCAL_WORLD_KEY = 'weaveborn_world_v1';
  let backend = null; // 'db' | 'local'
  let col = null;        // private character collection: data/users/<uid>
  let worldRef = null;   // shared doc: world/settings
  let listeners = [];
  let worldListeners = [];
  let cache = [];
  let world = { age: null };

  function notify() {
    listeners.forEach(function (fn) { fn(cache.slice()); });
  }

  function notifyWorld() {
    worldListeners.forEach(function (fn) { fn(Object.assign({}, world)); });
  }

  function localCharList() {
    try {
      const raw = window.localStorage.getItem(LOCAL_CHAR_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function localCharWrite(list) {
    try {
      window.localStorage.setItem(LOCAL_CHAR_KEY, JSON.stringify(list));
    } catch (e) { /* storage unavailable; ignore */ }
  }

  function localWorldRead() {
    try {
      const raw = window.localStorage.getItem(LOCAL_WORLD_KEY);
      return raw ? JSON.parse(raw) : { age: null };
    } catch (e) {
      return { age: null };
    }
  }

  function localWorldWrite(w) {
    try {
      window.localStorage.setItem(LOCAL_WORLD_KEY, JSON.stringify(w));
    } catch (e) { /* storage unavailable; ignore */ }
  }

  async function init() {
    try {
      const dbCap = window.claude ? await window.claude.use('db') : null;
      const userCap = window.claude ? await window.claude.use('user') : null;
      if (dbCap && userCap) {
        const uid = await userCap.id();
        if (uid) {
          backend = 'db';
          col = dbCap.collection('data/users/' + uid);
          col.onSnapshot(function (snap) {
            cache = snap.docs.map(function (d) { return d.data(); });
            notify();
          }, function () {
            // subscription died; keep whatever we last had
          });

          worldRef = dbCap.doc('world/settings');
          worldRef.onSnapshot(function (snap) {
            world = (snap.exists && snap.data()) ? snap.data() : { age: null };
            notifyWorld();
          }, function () {
            // subscription died; keep whatever we last had
          });
          return;
        }
      }
    } catch (e) { /* fall through to local */ }
    backend = 'local';
    cache = localCharList();
    world = localWorldRead();
    notify();
    notifyWorld();
  }

  function subscribe(fn) {
    listeners.push(fn);
    fn(cache.slice());
    return function () {
      listeners = listeners.filter(function (l) { return l !== fn; });
    };
  }

  function subscribeWorld(fn) {
    worldListeners.push(fn);
    fn(Object.assign({}, world));
    return function () {
      worldListeners = worldListeners.filter(function (l) { return l !== fn; });
    };
  }

  async function save(characterIn) {
    // Defensive deep clone: documents delivered by onSnapshot are frozen,
    // and callers should already clone before mutating — but save() must
    // never assume that, since character.updatedAt below would silently
    // no-op (or throw in strict mode) against a frozen object.
    const character = JSON.parse(JSON.stringify(characterIn));
    character.updatedAt = Date.now();
    const idx = cache.findIndex(function (c) { return c.id === character.id; });
    if (idx >= 0) cache[idx] = character; else cache.push(character);
    notify();
    if (backend === 'db' && col) {
      await col.doc(character.id).set(character);
    } else {
      localCharWrite(cache);
    }
  }

  async function remove(id) {
    cache = cache.filter(function (c) { return c.id !== id; });
    notify();
    if (backend === 'db' && col) {
      await col.doc(id).delete();
    } else {
      localCharWrite(cache);
    }
  }

  async function saveWorld(patch) {
    // Merge, don't replace: db .set() writes the WHOLE document, so a
    // caller answering just one question would otherwise wipe the rest.
    const w = Object.assign({}, world, JSON.parse(JSON.stringify(patch)));
    world = w;
    notifyWorld();
    if (backend === 'db' && worldRef) {
      await worldRef.set(w);
    } else {
      localWorldWrite(w);
    }
  }

  function backendName() { return backend; }

  return {
    init: init,
    subscribe: subscribe,
    save: save,
    remove: remove,
    backendName: backendName,
    subscribeWorld: subscribeWorld,
    saveWorld: saveWorld
  };
})();

/* ---------------- Utilities ---------------- */

function uid() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

/* Remaining pool values for a slot-assignment (axisValues), given the
   base pool and which key we're computing options for. */
function remainingPoolFor(pool, assignedMap, forKey) {
  const counts = {};
  pool.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
  Object.keys(assignedMap).forEach(function (k) {
    const v = assignedMap[k];
    if (k !== forKey && v !== null && v !== undefined && counts[v] !== undefined) {
      counts[v] -= 1;
    }
  });
  const options = [];
  const currentVal = assignedMap[forKey];
  const distinct = pool.filter(function (v, i) { return pool.indexOf(v) === i; }).sort(function (a, b) { return b - a; });
  distinct.forEach(function (v) {
    const remaining = counts[v] || 0;
    if (remaining > 0 || v === currentVal) options.push(v);
  });
  return options;
}

function poolFullyAssigned(pool, assignedMap, keys) {
  return keys.every(function (k) { return assignedMap[k] !== null && assignedMap[k] !== undefined; });
}

function poolRemainingSummary(pool, assignedMap, keys) {
  const counts = {};
  pool.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
  keys.forEach(function (k) {
    const v = assignedMap[k];
    if (v !== null && v !== undefined && counts[v] !== undefined) counts[v] -= 1;
  });
  const left = [];
  Object.keys(counts).sort(function (a, b) { return b - a; }).forEach(function (v) {
    for (let i = 0; i < counts[v]; i++) left.push(v);
  });
  return left.length ? 'Still to place: ' + left.join(', ') : 'All ratings placed.';
}

/* Cycles a stat's staged Karma boost 0 -> 1 -> 2 -> 0. If advancing would
   push the total staged across all stats past the per-roll cap, snaps
   back to 0 instead of advancing. */
function cycleKarmaBoost(pb, character, axisKey) {
  const cap = pb.karma.maxPerRoll;
  const current = character.karmaBoost[axisKey] || 0;
  const next = (current + 1) % 3;
  if (next !== 0) {
    const otherTotal = pb.axisOrder.reduce(function (sum, k) {
      return sum + (k === axisKey ? 0 : (character.karmaBoost[k] || 0));
    }, 0);
    if (otherTotal + next > cap) {
      character.karmaBoost[axisKey] = 0;
      return;
    }
  }
  character.karmaBoost[axisKey] = next;
}

function effectiveStat(c, pb, key) {
  const base = c.axisValues[key];
  const boost = (c.karmaBoost && c.karmaBoost[key]) || 0;
  const deb = pb.debilities.filter(function (d) { return d.stat === key; })[0] || null;
  const penalty = (deb && c.debilities[deb.key]) ? 1 : 0;
  return { base: base, boost: boost, penalty: penalty, total: base + boost - penalty, debility: deb };
}

/* Fills in defaults for any fields a legacy/partial save might be missing,
   so older saved characters don't crash the newer UI. */
function normalizeCharacter(c) {
  const pb = PLAYBOOKS[c.playbookId];
  if (typeof c.karma !== 'number') c.karma = 0;
  if (!c.karmaBoost) c.karmaBoost = {};
  if (!c.axisValues) c.axisValues = {};
  if (!c.styleValues) c.styleValues = {};
  if (!c.debilities) c.debilities = {};
  pb.axisOrder.forEach(function (k) {
    if (typeof c.karmaBoost[k] !== 'number') c.karmaBoost[k] = 0;
    if (typeof c.axisValues[k] !== 'number') c.axisValues[k] = 0;
  });
  pb.styleTypes.forEach(function (s) {
    if (typeof c.styleValues[s.key] !== 'number') c.styleValues[s.key] = 0;
  });
  pb.debilities.forEach(function (d) {
    if (typeof c.debilities[d.key] !== 'boolean') c.debilities[d.key] = false;
  });
  if (typeof c.harm !== 'number') c.harm = 0;
  if (typeof c.strain !== 'number') c.strain = 0;
  if (!c.skills) c.skills = { expert: null, trained: [] };
  if (!c.notes) c.notes = '';
}

/* ---------------- App state ---------------- */

const state = {
  view: 'home', // 'home' | 'chooseThread' | 'worldPlaybook' | 'wizard' | 'sheet'
  characters: [],
  activeId: null,
  wizardStep: 0,
  wizardEditingId: null,
  draft: null,
  toast: null,
  confirmDelete: false,
  world: { age: null }
};

function newDraft(playbookId) {
  const pb = PLAYBOOKS[playbookId];
  const axisValues = {};
  pb.axisOrder.forEach(function (k) { axisValues[k] = null; });
  const styleValues = {};
  pb.styleTypes.forEach(function (s) { styleValues[s.key] = null; });
  const karmaBoost = {};
  pb.axisOrder.forEach(function (k) { karmaBoost[k] = 0; });
  const debilities = {};
  pb.debilities.forEach(function (d) { debilities[d.key] = false; });
  return {
    id: uid(),
    playbookId: playbookId,
    name: '',
    aspiration: null,   // text string once chosen
    formative: null,    // key string once chosen (resolved to an object at save time)
    axisValues: axisValues,
    styleValues: styleValues,
    skills: { expert: null, trained: [] },
    ability: null,      // key string once chosen (resolved to an object at save time)
    harm: 0,
    strain: 0,
    debilities: debilities,
    karma: 0,
    karmaBoost: karmaBoost,
    notes: ''
  };
}

/* Turns a saved character back into wizard-editable draft shape:
   formative/ability go from resolved objects back to plain keys. */
function draftFromCharacter(c) {
  const d = JSON.parse(JSON.stringify(c));
  if (d.formative && typeof d.formative === 'object') d.formative = d.formative.key;
  if (d.ability && typeof d.ability === 'object') d.ability = d.ability.key;
  return d;
}

/* Turns a wizard draft into a storable character: formative/ability keys
   get resolved (and snapshotted) into full objects so the character stays
   self-describing even if the source tables change later. */
function finalizeCharacter(draft, pb) {
  const c = JSON.parse(JSON.stringify(draft));
  const formativeObj = pb.formativeExperiences.filter(function (f) { return f.key === draft.formative; })[0];
  c.formative = formativeObj
    ? { key: formativeObj.key, label: formativeObj.label, desc: formativeObj.desc, polarity: formativeObj.polarity }
    : draft.formative;
  const abilityObj = pb.abilities.filter(function (a) { return a.key === draft.ability; })[0];
  c.ability = abilityObj
    ? { key: abilityObj.key, name: abilityObj.name, body: abilityObj.body, bonus: abilityObj.bonus }
    : draft.ability;
  return c;
}

/* ---------------- Rendering root ---------------- */

const root = document.getElementById('app');

function render() {
  if (state.view === 'home') root.innerHTML = renderHome();
  else if (state.view === 'chooseThread') root.innerHTML = renderChooseThread();
  else if (state.view === 'worldPlaybook') root.innerHTML = renderWorldPlaybook();
  else if (state.view === 'wizard') root.innerHTML = renderWizard();
  else if (state.view === 'sheet') root.innerHTML = renderSheet();
  renderToast();
}

function renderToast() {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  if (state.toast) {
    el.textContent = state.toast;
    el.classList.add('toast-visible');
    clearTimeout(el._t);
    el._t = setTimeout(function () {
      el.classList.remove('toast-visible');
    }, 1600);
  }
}

function showToast(msg) {
  state.toast = msg;
  renderToast();
}

/* ---------------- Home view ---------------- */

function renderHome() {
  const chars = state.characters;
  const backendNote = Store.backendName() === 'db'
    ? 'Threads saved to your account.'
    : 'Threads saved in this browser.';

  let list;
  if (!chars.length) {
    list = '' +
      '<div class="empty-loom">' +
      '  <p class="empty-loom-title">The loom is bare.</p>' +
      '  <p class="empty-loom-body">Weave your first Thread to begin.</p>' +
      '</div>';
  } else {
    list = '<div class="char-grid">' + chars.map(renderCharCard).join('') + '</div>';
  }

  return '' +
    '<header class="home-header">' +
    '  <p class="kicker">Weaveborn</p>' +
    '  <h1>The Loom</h1>' +
    '  <p class="home-sub">Your woven Threads, ready to pick back up.</p>' +
    '</header>' +
    '<button class="world-strip" data-action="open-world">' +
    '  <span class="world-strip-label">World Playbook</span>' +
    '  <span class="world-strip-value">' + worldSummaryText() + '</span>' +
    '</button>' +
    list +
    '<button class="btn btn-primary btn-new" data-action="new-character">Weave a new Thread</button>' +
    '<p class="storage-note">' + backendNote + '</p>';
}

function worldSummaryText() {
  const world = state.world || {};
  const answeredCount = WORLD_REQUIRED_KEYS.filter(function (k) { return !!world[k]; }).length;
  if (answeredCount === 0) return 'Not started — tap to begin';
  const ageLabel = world.age ? AGES[world.age].name : 'Age not set';
  return ageLabel + ' · ' + answeredCount + '/' + WORLD_REQUIRED_KEYS.length + ' answered';
}

/* ---------------- World Playbook view ---------------- */
/* Shared, group-level answers from the World Playbook — anyone who opens
   this app can see and change them, same as the rest of this app's
   shared data defaults to working. Doubles as the reference view: every
   option's full text stays visible here, not just the chosen one, so the
   table can look back up what a choice actually means. Age is the only
   question that also changes character creation (setting skills). */

function renderWorldPlaybook() {
  const world = state.world || {};
  const sections = WORLD_QUESTIONS.map(function (q) {
    const answer = world[q.key];
    const cards = q.options.map(function (opt) {
      const active = answer === opt.key;
      const skillTag = (q.key === 'age' && AGES[opt.key])
        ? ('<span class="thread-pick-skills">Adds: ' + escapeHtml(AGES[opt.key].settingSkills.map(function (s) { return s.name; }).join(' & ')) + '</span>')
        : '';
      return '' +
        '<button class="thread-pick-card' + (active ? ' thread-pick-card-active' : '') + '" data-action="answer-world" data-question="' + q.key + '" data-option="' + opt.key + '">' +
        '  <span class="thread-pick-name">' + escapeHtml(opt.label) + (active ? ' <span class="age-current-tag">chosen</span>' : '') + '</span>' +
        '  <span class="thread-pick-sub">' + escapeHtml(opt.desc) + '</span>' +
        skillTag +
        '</button>';
    }).join('');
    return '' +
      '<section class="wiz-section world-question">' +
      '  <h2>' + escapeHtml(q.title) + (q.optional ? ' <span class="optional-tag">optional</span>' : '') + '</h2>' +
      (q.prompt ? ('<p class="wiz-hint">' + escapeHtml(q.prompt) + '</p>') : '') +
      '  <div class="thread-pick-grid">' + cards + '</div>' +
      '</section>';
  }).join('');

  return '' +
    '<header class="home-header">' +
    '  <p class="kicker">Weaveborn</p>' +
    '  <h1>World Playbook</h1>' +
    '  <p class="home-sub">Decide this together. Shared and editable by anyone who opens this app. Tap a chosen answer again to clear it. The Age also decides which setting skills characters can train.</p>' +
    '</header>' +
    sections +
    '<button class="btn btn-ghost btn-new" data-action="go-home">Back to the Loom</button>';
}

/* ---------------- Choose Thread view ---------------- */

function renderChooseThread() {
  const cards = PLAYBOOK_LIST.map(function (id) {
    const pb = PLAYBOOKS[id];
    return '' +
      '<button class="thread-pick-card" data-action="choose-thread" data-playbook="' + id + '">' +
      '  <span class="thread-pick-name">' + escapeHtml(pb.name) + '</span>' +
      '  <span class="thread-pick-sub">Weave a ' + escapeHtml(pb.name) + ' Thread</span>' +
      '</button>';
  }).join('');

  return '' +
    '<header class="home-header">' +
    '  <p class="kicker">Weaveborn</p>' +
    '  <h1>Choose your Thread</h1>' +
    '  <p class="home-sub">Which power will you weave?</p>' +
    '</header>' +
    '<div class="thread-pick-grid">' + cards + '</div>' +
    '<button class="btn btn-ghost btn-new" data-action="go-home">Cancel</button>';
}

function renderCharCard(c) {
  const pb = PLAYBOOKS[c.playbookId];
  const harmBad = c.harm >= pb.harm.badAt;
  const strainBad = c.strain >= pb.strain.badAt;
  return '' +
    '<button class="char-card" data-action="open-character" data-id="' + c.id + '">' +
    '  <span class="char-card-thread">' + escapeHtml(pb.name) + '</span>' +
    '  <span class="char-card-name">' + escapeHtml(c.name || 'Unnamed') + '</span>' +
    '  <span class="char-card-status">' +
    '    <span class="' + (harmBad ? 'pip-bad' : '') + '">Harm ' + c.harm + '/' + pb.harm.max + '</span>' +
    '    <span class="' + (strainBad ? 'pip-bad' : '') + '">Strain ' + c.strain + '/' + pb.strain.max + '</span>' +
    '  </span>' +
    '</button>';
}

/* ---------------- Wizard view ---------------- */

const WIZARD_STEPS = ['Identity', 'Threadcraft', 'Training', 'Ability', 'Review'];

function renderWizard() {
  const d = state.draft;
  const pb = PLAYBOOKS[d.playbookId];
  const stepIdx = state.wizardStep;

  const stepsNav = WIZARD_STEPS.map(function (label, i) {
    const cls = ['step-tab'];
    if (i === stepIdx) cls.push('step-tab-active');
    if (i < stepIdx) cls.push('step-tab-done');
    return '<div class="' + cls.join(' ') + '">' + (i + 1) + '. ' + label + '</div>';
  }).join('');

  let body;
  if (stepIdx === 0) body = stepIdentity(d, pb);
  else if (stepIdx === 1) body = stepThreadcraft(d, pb);
  else if (stepIdx === 2) body = stepTraining(d, pb);
  else if (stepIdx === 3) body = stepAbility(d, pb);
  else body = stepReview(d, pb);

  const canBack = stepIdx > 0;
  const isLast = stepIdx === WIZARD_STEPS.length - 1;
  const canAdvance = stepValid(stepIdx, d, pb);

  return '' +
    '<div class="wizard">' +
    '  <div class="step-nav">' + stepsNav + '</div>' +
    '  <div class="wizard-body">' + body + '</div>' +
    '  <div class="wizard-footer">' +
    '    <button class="btn btn-ghost" data-action="wizard-cancel">Cancel</button>' +
    '    <div class="wizard-footer-right">' +
    (canBack ? '<button class="btn btn-ghost" data-action="wizard-back">Back</button>' : '') +
    (isLast
      ? '<button class="btn btn-primary" data-action="wizard-save">Save Thread</button>'
      : '<button class="btn btn-primary" data-action="wizard-next" ' + (canAdvance ? '' : 'disabled') + '>Next</button>') +
    '    </div>' +
    '  </div>' +
    '</div>';
}

function stepValid(stepIdx, d, pb) {
  if (stepIdx === 0) return !!(d.name.trim() && d.aspiration !== null && d.formative !== null);
  if (stepIdx === 1) {
    const axesDone = poolFullyAssigned(pb.axisPool, d.axisValues, pb.axisOrder);
    const styleKeys = pb.styleTypes.map(function (s) { return s.key; });
    const stylesDone = poolFullyAssigned(pb.stylePool, d.styleValues, styleKeys);
    return axesDone && stylesDone;
  }
  if (stepIdx === 2) return d.skills.expert !== null && d.skills.trained.length === 3;
  if (stepIdx === 3) return d.ability !== null;
  return true;
}

function radioRow(group, value, checked, labelHtml) {
  return '' +
    '<label class="radio-row' + (checked ? ' radio-row-checked' : '') + '">' +
    '  <input type="radio" name="' + group + '" value="' + value + '" ' + (checked ? 'checked' : '') + ' data-action="pick-' + group + '" />' +
    '  <span>' + labelHtml + '</span>' +
    '</label>';
}

function stepIdentity(d, pb) {
  const aspirationRows = pb.aspirations.map(function (a, i) {
    return radioRow('aspiration', i, d.aspiration === a, escapeHtml(a));
  }).join('');

  const inspirations = pb.formativeExperiences.filter(function (f) { return f.polarity === 'inspiration'; });
  const burdens = pb.formativeExperiences.filter(function (f) { return f.polarity === 'burden'; });

  function formativeRow(f) {
    return '' +
      '<label class="radio-row formative-row' + (d.formative === f.key ? ' radio-row-checked' : '') + '">' +
      '  <input type="radio" name="formative" value="' + f.key + '" ' + (d.formative === f.key ? 'checked' : '') + ' data-action="pick-formative" />' +
      '  <span class="formative-text"><strong>' + escapeHtml(f.label) + '</strong> — ' + escapeHtml(f.desc) + '</span>' +
      '</label>';
  }

  return '' +
    '<section class="wiz-section">' +
    '  <h2>Who are you?</h2>' +
    '  <label class="field-label" for="name-input">Name</label>' +
    '  <div class="name-row">' +
    '    <input id="name-input" class="text-input" type="text" maxlength="40" value="' + escapeHtml(d.name) + '" placeholder="Your character\'s name" data-field="name" />' +
    '    <button class="btn btn-ghost btn-pun" data-action="pun-name" type="button">Puntastic name</button>' +
    '  </div>' +
    '</section>' +
    '<section class="wiz-section">' +
    '  <div class="section-head-row"><h2>Aspiration</h2><button class="btn btn-ghost btn-random" data-action="random-aspiration" type="button">🎲 Random</button></div>' +
    '  <p class="wiz-hint">What drives you? Pick one.</p>' +
    '  <div class="radio-list" data-group="aspiration">' + aspirationRows + '</div>' +
    '</section>' +
    '<section class="wiz-section">' +
    '  <div class="section-head-row"><h2>Formative Experience</h2><button class="btn btn-ghost btn-random" data-action="random-formative" type="button">🎲 Random</button></div>' +
    '  <p class="wiz-hint">What shaped you before your Thread awoke? Pick one.</p>' +
    '  <h3 class="formative-subhead">Inspirations</h3>' +
    '  <div class="radio-list">' + inspirations.map(formativeRow).join('') + '</div>' +
    '  <h3 class="formative-subhead formative-subhead-burden">Burdens</h3>' +
    '  <div class="radio-list">' + burdens.map(formativeRow).join('') + '</div>' +
    '</section>';
}

function axisLevelText(axis, value) {
  if (value === null || value === undefined) return null;
  if (!axis.levels || axis.levels[value] === undefined) return null;
  return axis.levels[value];
}

function poolSelect(name, options, current) {
  let opts = '<option value="">—</option>';
  const all = options.slice();
  if (current !== null && current !== undefined && all.indexOf(current) === -1) all.push(current);
  all.sort(function (a, b) { return b - a; });
  all.forEach(function (v) {
    opts += '<option value="' + v + '" ' + (current === v ? 'selected' : '') + '>' + v + '</option>';
  });
  return '<select class="pool-select" data-pool-field="' + name + '">' + opts + '</select>';
}

function stepThreadcraft(d, pb) {
  const axisRows = pb.axisOrder.map(function (key) {
    const axis = pb.axes[key];
    const options = remainingPoolFor(pb.axisPool, d.axisValues, key);
    const current = d.axisValues[key];
    const selectHtml = poolSelect('axis-' + key, options, current);
    const levelText = axisLevelText(axis, current);
    return '' +
      '<div class="axis-row">' +
      '  <div class="axis-row-head">' +
      '    <span class="axis-label">' + escapeHtml(axis.label) + '</span>' +
      selectHtml +
      '  </div>' +
      '  <p class="axis-hint">' + escapeHtml(axis.hint) + '</p>' +
      '  <p class="axis-current-text">' + (levelText ? escapeHtml(levelText) : 'Choose a rating to see what it allows.') + '</p>' +
      '</div>';
  }).join('');

  const axisPoolLeft = poolRemainingSummary(pb.axisPool, d.axisValues, pb.axisOrder);

  const styleKeys = pb.styleTypes.map(function (s) { return s.key; });
  const styleRows = pb.styleTypes.map(function (s) {
    const options = remainingPoolFor(pb.stylePool, d.styleValues, s.key);
    const current = d.styleValues[s.key];
    const selectHtml = poolSelect('style-' + s.key, options, current);
    const examplesHtml = '<ul class="style-examples">' + s.examples.map(function (ex) { return '<li>' + escapeHtml(ex) + '</li>'; }).join('') + '</ul>';
    return '' +
      '<div class="style-row">' +
      '  <div class="axis-row-head">' +
      '    <span class="axis-label">' + escapeHtml(s.label) + '</span>' +
      selectHtml +
      '  </div>' +
      '  <p class="axis-hint">' + escapeHtml(s.desc) + '</p>' +
      examplesHtml +
      '</div>';
  }).join('');

  const stylePoolLeft = poolRemainingSummary(pb.stylePool, d.styleValues, styleKeys);

  return '' +
    '<section class="wiz-section">' +
    '  <h2>Threadcraft</h2>' +
    '  <p class="wiz-hint">Assign <strong>' + pb.axisPool.join(', ') + '</strong> across your five ratings — one value each.</p>' +
    '  <p class="pool-status">' + axisPoolLeft + '</p>' +
    axisRows +
    '</section>' +
    '<section class="wiz-section">' +
    '  <h2>Style</h2>' +
    '  <p class="wiz-hint">Assign <strong>' + pb.stylePool.join(', ') + '</strong> across the three Styles — how you tend to use your Thread, not how big an effect you can make.</p>' +
    '  <p class="pool-status">' + stylePoolLeft + '</p>' +
    styleRows +
    '</section>';
}

function stepTraining(d, pb) {
  const world = state.world;
  const alreadyChosen = d.skills.expert ? [d.skills.expert].concat(d.skills.trained) : d.skills.trained;
  const skillList = availableSkillList(world, alreadyChosen);
  const ageNote = (world && world.age)
    ? ('Includes setting skills from ' + escapeHtml(AGES[world.age].name) + '.')
    : 'World Age isn\u2019t set yet, so only Core Skills are shown. Set it from the Loom to unlock setting skills — or come back and edit this later.';

  const rows = skillList.map(function (skill) {
    const isExpert = d.skills.expert === skill;
    const isTrained = d.skills.trained.indexOf(skill) !== -1;
    const trainedDisabled = !isTrained && !isExpert && d.skills.trained.length >= 3;
    const desc = skillDescription(skill, world ? world.age : null);
    return '' +
      '<div class="skill-row">' +
      '  <span class="skill-name-wrap">' +
      '    <span class="skill-name">' + escapeHtml(skill) + '</span>' +
      (desc ? ('<span class="skill-desc">' + escapeHtml(desc) + '</span>') : '') +
      '  </span>' +
      '  <label class="skill-toggle">' +
      '    <input type="radio" name="expert-skill" data-action="pick-expert" value="' + escapeHtml(skill) + '" ' + (isExpert ? 'checked' : '') + ' />' +
      '    Expert (+2)' +
      '  </label>' +
      '  <label class="skill-toggle' + (trainedDisabled ? ' skill-toggle-disabled' : '') + '">' +
      '    <input type="checkbox" data-action="pick-trained" value="' + escapeHtml(skill) + '" ' + (isTrained ? 'checked' : '') + ' ' + (isExpert || trainedDisabled ? 'disabled' : '') + ' />' +
      '    Trained (+1)' +
      '  </label>' +
      '</div>';
  }).join('');

  return '' +
    '<section class="wiz-section">' +
    '  <h2>Training</h2>' +
    '  <p class="wiz-hint">Pick 1 Expert (+2) and 3 Trained (+1). Everything else stays Untrained (-1).</p>' +
    '  <p class="age-note">' + ageNote + '</p>' +
    '  <p class="pool-status">Expert: ' + (d.skills.expert ? escapeHtml(d.skills.expert) : '—') + ' &nbsp;·&nbsp; Trained: ' + d.skills.trained.length + '/3</p>' +
    '  <div class="skill-list">' + rows + '</div>' +
    '</section>';
}

function stepAbility(d, pb) {
  const rows = pb.abilities.map(function (a) {
    const checked = d.ability === a.key;
    return '' +
      '<label class="ability-row' + (checked ? ' ability-row-checked' : '') + '">' +
      '  <input type="radio" name="ability" value="' + a.key + '" ' + (checked ? 'checked' : '') + ' data-action="pick-ability" />' +
      '  <span class="ability-name">' + escapeHtml(a.name) + '</span>' +
      '  <span class="ability-body">' + escapeHtml(a.body) + '</span>' +
      '  <span class="ability-bonus">' + escapeHtml(a.bonus) + '</span>' +
      '</label>';
  }).join('');

  return '' +
    '<section class="wiz-section">' +
    '  <h2>Starting Ability</h2>' +
    '  <p class="wiz-hint">Pick one.</p>' +
    '  <div class="ability-list">' + rows + '</div>' +
    '</section>';
}

function stepReview(d, pb) {
  const formative = pb.formativeExperiences.filter(function (f) { return f.key === d.formative; })[0];
  const ability = pb.abilities.filter(function (a) { return a.key === d.ability; })[0];
  const axisSummary = pb.axisOrder.map(function (k) {
    return '<span class="review-chip">' + pb.axes[k].label + ' ' + d.axisValues[k] + '</span>';
  }).join('');
  const styleSummary = pb.styleTypes.map(function (s) {
    const v = d.styleValues[s.key];
    return '<span class="review-chip">' + s.label + ' ' + (v > 0 ? '+' + v : v) + '</span>';
  }).join('');

  return '' +
    '<section class="wiz-section">' +
    '  <h2>Review your Thread</h2>' +
    '  <p class="review-name">' + escapeHtml(d.name) + '</p>' +
    '  <p class="review-line">' + escapeHtml(d.aspiration) + '</p>' +
    '  <p class="review-line">' + escapeHtml(formative.label) + ' <span class="pair-slash">·</span> ' + escapeHtml(formative.desc) + '</p>' +
    '  <div class="review-chips">' + axisSummary + '</div>' +
    '  <div class="review-chips">' + styleSummary + '</div>' +
    '  <p class="review-line">Expert: ' + escapeHtml(d.skills.expert) + ' &nbsp;·&nbsp; Trained: ' + d.skills.trained.map(escapeHtml).join(', ') + '</p>' +
    '  <p class="review-line">' + (ability ? escapeHtml(ability.name) : '') + '</p>' +
    '</section>';
}

/* ---------------- Sheet view ---------------- */

function renderTrackRow(kind, pb, c) {
  const cfg = pb[kind];
  const bad = c[kind] >= cfg.badAt;
  const label = kind === 'harm' ? 'Harm' : 'Strain';
  return '' +
    '<div class="track-row">' +
    '  <span class="track-label-wrap">' +
    '    <span class="track-label' + (bad ? ' track-label-bad' : '') + '">' + label + '</span>' +
    (bad ? ('<span class="track-status-badge">' + escapeHtml(cfg.badLabel) + '</span>') : '') +
    '  </span>' +
    '  <button class="stepper-btn" data-action="track-dec" data-kind="' + kind + '" ' + (c[kind] <= 0 ? 'disabled' : '') + ' aria-label="Remove ' + label + '">−</button>' +
    renderPipTrack(kind, cfg.max, c[kind], cfg.badAt) +
    '  <button class="stepper-btn" data-action="track-inc" data-kind="' + kind + '" ' + (c[kind] >= cfg.max ? 'disabled' : '') + ' aria-label="Add ' + label + '">+</button>' +
    '  <span class="track-count">' + c[kind] + '/' + cfg.max + '</span>' +
    '</div>';
}

function renderPipTrack(kind, max, value, badAt) {
  let pips = '';
  for (let i = 0; i < max; i++) {
    const filled = i < value;
    const marksBad = i === badAt - 1;
    pips += '<button class="pip' + (filled ? ' pip-filled' : '') + (marksBad ? ' pip-threshold' : '') + '" data-action="set-' + kind + '" data-index="' + i + '" aria-label="' + kind + ' ' + (i + 1) + '"></button>';
  }
  return '<div class="pip-track">' + pips + '</div>';
}

function renderKarmaSection(c, pb) {
  const staged = pb.axisOrder.reduce(function (sum, k) { return sum + ((c.karmaBoost && c.karmaBoost[k]) || 0); }, 0);
  const canRoll = c.karma >= staged;
  return '' +
    '<div class="karma-row">' +
    '  <span class="karma-label">Karma</span>' +
    '  <button class="stepper-btn" data-action="karma-dec" ' + (c.karma <= 0 ? 'disabled' : '') + ' aria-label="Remove Karma">−</button>' +
    '  <span class="karma-value">' + c.karma + '</span>' +
    '  <button class="stepper-btn" data-action="karma-inc" aria-label="Add Karma">+</button>' +
    '</div>' +
    '<p class="karma-hint">Tap a stat below to stage a Karma boost' +
    (staged > 0 ? (' <span class="karma-staged-tag">— ' + staged + '/' + pb.karma.maxPerRoll + ' staged</span>') : '') +
    '</p>' +
    '<button class="btn btn-primary btn-roll" data-action="roll" ' + (canRoll ? '' : 'disabled') + '>' +
    (staged > 0 ? 'Roll — spend ' + staged + ' Karma' : 'Roll') +
    '</button>';
}

function renderStatCard(c, pb, key) {
  const axis = pb.axes[key];
  const eff = effectiveStat(c, pb, key);
  const deb = eff.debility;
  const debActive = deb ? !!c.debilities[deb.key] : false;
  const levelText = axisLevelText(axis, eff.total);
  const modified = eff.total !== eff.base;
  return '' +
    '<div class="stat-card" data-action="cycle-karma-boost" data-key="' + key + '" role="button" tabindex="0" aria-label="' + escapeHtml(axis.label) + ', tap to stage a Karma boost">' +
    '  <div class="stat-card-top">' +
    '    <span class="stat-card-title">' +
    '      <span class="stat-card-label">' + escapeHtml(axis.label) + '</span>' +
    (deb ? ('<button class="debility-pill' + (debActive ? ' debility-pill-active' : '') + '" data-action="toggle-debility" data-key="' + deb.key + '" title="' + escapeHtml(deb.blurb) + '">' + escapeHtml(deb.label) + ' −1</button>') : '') +
    '    </span>' +
    '    <span class="stat-card-total-wrap">' +
    (eff.boost > 0 ? ('<span class="stat-card-boost-tag">+' + eff.boost + '</span>') : '') +
    '      <span class="stat-card-total' + (modified ? ' stat-card-total-modified' : '') + '">' + eff.total + '</span>' +
    '    </span>' +
    '  </div>' +
    '  <p class="stat-card-desc">' + (levelText ? escapeHtml(levelText) : '') + '</p>' +
    '</div>';
}

/* Style is a flat 1/0/-1 modifier chosen once at creation — not tied to
   Karma or Debilities, so the sheet card is a plain read-out, not a
   button. The examples stay visible for quick reference during play. */
function renderStyleCard(c, pb, styleKey) {
  const style = pb.styleTypes.filter(function (s) { return s.key === styleKey; })[0];
  const val = c.styleValues[styleKey];
  const examplesHtml = '<ul class="style-examples">' + style.examples.map(function (ex) { return '<li>' + escapeHtml(ex) + '</li>'; }).join('') + '</ul>';
  return '' +
    '<div class="stat-card style-card-sheet">' +
    '  <div class="stat-card-top">' +
    '    <span class="stat-card-label">' + escapeHtml(style.label) + '</span>' +
    '    <span class="stat-card-total">' + (val > 0 ? '+' + val : val) + '</span>' +
    '  </div>' +
    '  <p class="stat-card-desc">' + escapeHtml(style.desc) + '</p>' +
    examplesHtml +
    '</div>';
}

function renderSheet() {
  const c = state.characters.filter(function (ch) { return ch.id === state.activeId; })[0];
  if (!c) { state.view = 'home'; return renderHome(); }
  normalizeCharacter(c);
  const pb = PLAYBOOKS[c.playbookId];

  const formative = (c.formative && typeof c.formative === 'object')
    ? c.formative
    : { label: String(c.formative || '—'), desc: '', polarity: '' };
  const ability = (c.ability && typeof c.ability === 'object')
    ? c.ability
    : (pb.abilities.filter(function (a) { return a.key === c.ability; })[0] || { name: 'Ability', body: '', bonus: '' });

  const statCards = pb.axisOrder.map(function (key) { return renderStatCard(c, pb, key); }).join('');
  const styleCards = pb.styleTypes.map(function (s) { return renderStyleCard(c, pb, s.key); }).join('');

  const sheetSkillChosen = c.skills.expert ? [c.skills.expert].concat(c.skills.trained) : c.skills.trained;
  const sheetSkillList = availableSkillList(state.world, sheetSkillChosen);
  const skillRows = sheetSkillList.map(function (skill) {
    let mod = -1, tag = 'Untrained';
    if (c.skills.expert === skill) { mod = 2; tag = 'Expert'; }
    else if (c.skills.trained.indexOf(skill) !== -1) { mod = 1; tag = 'Trained'; }
    return '' +
      '<div class="sheet-skill sheet-skill-' + tag.toLowerCase() + '">' +
      '  <span>' + escapeHtml(skill) + '</span>' +
      '  <span>' + (mod > 0 ? '+' + mod : mod) + '</span>' +
      '</div>';
  }).join('');

  return '' +
    '<div class="sheet">' +
    '  <div class="sheet-topbar">' +
    '    <button class="btn btn-ghost" data-action="go-home">&larr; The Loom</button>' +
    '    <div class="sheet-topbar-actions">' +
    (state.confirmDelete
      ? ('<span class="confirm-delete-text">Delete for good?</span>' +
         '<button class="btn btn-ghost" data-action="cancel-delete">Cancel</button>' +
         '<button class="btn btn-danger btn-danger-solid" data-action="confirm-delete">Yes, delete</button>')
      : ('<button class="btn btn-ghost" data-action="edit-character">Edit build</button>' +
         '<button class="btn btn-ghost btn-danger" data-action="delete-character">Delete</button>')) +
    '    </div>' +
    '  </div>' +
    '  <header class="sheet-header">' +
    '    <p class="kicker">' + escapeHtml(pb.name) + ' Thread</p>' +
    '    <h1>' + escapeHtml(c.name) + '</h1>' +
    '    <p class="sheet-aspiration">' + escapeHtml(c.aspiration || '') + '</p>' +
    '    <p class="sheet-formative"><strong>' + escapeHtml(formative.label) + '</strong>' + (formative.desc ? (' — ' + escapeHtml(formative.desc)) : '') + '</p>' +
    '  </header>' +

    '  <section class="sheet-section">' +
    '    <h2>Harm &amp; Strain</h2>' +
    renderTrackRow('harm', pb, c) +
    renderTrackRow('strain', pb, c) +
    '  </section>' +

    '  <section class="sheet-section">' +
    '    <h2>Threadcraft</h2>' +
    renderKarmaSection(c, pb) +
    '    <div class="stat-card-list">' + statCards + '</div>' +
    '    <h3 class="sheet-subhead">Style</h3>' +
    '    <div class="stat-card-list">' + styleCards + '</div>' +
    '  </section>' +

    '  <section class="sheet-section">' +
    '    <h2>Training</h2>' +
    '    <div class="sheet-skill-grid">' + skillRows + '</div>' +
    '  </section>' +

    '  <section class="sheet-section">' +
    '    <h2>' + escapeHtml(ability.name || 'Ability') + '</h2>' +
    '    <p class="sheet-ability-body">' + escapeHtml(ability.body || '') + '</p>' +
    '    <p class="sheet-ability-bonus">' + escapeHtml(ability.bonus || '') + '</p>' +
    '  </section>' +

    '  <section class="sheet-section">' +
    '    <h2>Notes</h2>' +
    '    <textarea class="notes-area" data-field="notes" placeholder="Scratch notes, gear, allies...">' + escapeHtml(c.notes || '') + '</textarea>' +
    '  </section>' +
    '</div>';
}

/* ---------------- Event handling ---------------- */

function currentCharacter() {
  return state.characters.filter(function (c) { return c.id === state.activeId; })[0] || null;
}

async function persistActive(mutator) {
  const original = currentCharacter();
  if (!original) return;
  // The character we hold may be a frozen db snapshot (see Store.init's
  // onSnapshot) — never mutate it directly. Clone, mutate the clone, save that.
  const c = JSON.parse(JSON.stringify(original));
  mutator(c);
  await Store.save(c);
  showToast('Saved');
  render();
}

document.addEventListener('click', async function (e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.getAttribute('data-action');

  if (action === 'new-character') {
    state.view = 'chooseThread';
    render();
  } else if (action === 'choose-thread') {
    const playbookId = el.getAttribute('data-playbook');
    state.draft = newDraft(playbookId);
    state.wizardEditingId = null;
    state.wizardStep = 0;
    state.view = 'wizard';
    render();
  } else if (action === 'open-world') {
    state.view = 'worldPlaybook';
    render();
  } else if (action === 'answer-world') {
    const qKey = el.getAttribute('data-question');
    const optKey = el.getAttribute('data-option');
    const current = state.world ? state.world[qKey] : null;
    const next = current === optKey ? null : optKey; // tap the chosen answer again to clear it
    const patch = {};
    patch[qKey] = next;
    await Store.saveWorld(patch);
    if (next) {
      const q = WORLD_QUESTIONS.filter(function (item) { return item.key === qKey; })[0];
      const opt = q.options.filter(function (o) { return o.key === optKey; })[0];
      showToast(q.title + ': ' + opt.label);
    }
    render();
  } else if (action === 'open-character') {
    state.activeId = el.getAttribute('data-id');
    state.confirmDelete = false;
    state.view = 'sheet';
    render();
  } else if (action === 'go-home') {
    state.confirmDelete = false;
    state.view = 'home';
    render();
  } else if (action === 'wizard-cancel') {
    state.view = state.wizardEditingId ? 'sheet' : 'home';
    if (state.wizardEditingId) state.activeId = state.wizardEditingId;
    render();
  } else if (action === 'wizard-back') {
    state.wizardStep = Math.max(0, state.wizardStep - 1);
    render();
  } else if (action === 'wizard-next') {
    const pb = PLAYBOOKS[state.draft.playbookId];
    if (stepValid(state.wizardStep, state.draft, pb)) {
      state.wizardStep = Math.min(WIZARD_STEPS.length - 1, state.wizardStep + 1);
      render();
    }
  } else if (action === 'wizard-save') {
    const pb = PLAYBOOKS[state.draft.playbookId];
    const finalized = finalizeCharacter(state.draft, pb);
    await Store.save(finalized);
    state.activeId = finalized.id;
    state.view = 'sheet';
    state.draft = null;
    showToast('Thread saved');
    render();
  } else if (action === 'pun-name') {
    const pb = PLAYBOOKS[state.draft.playbookId];
    const pick = pb.punNames[Math.floor(Math.random() * pb.punNames.length)];
    state.draft.name = pick;
    render();
  } else if (action === 'random-aspiration') {
    const pb = PLAYBOOKS[state.draft.playbookId];
    state.draft.aspiration = pb.aspirations[Math.floor(Math.random() * pb.aspirations.length)];
    render();
  } else if (action === 'random-formative') {
    const pb = PLAYBOOKS[state.draft.playbookId];
    const pick = pb.formativeExperiences[Math.floor(Math.random() * pb.formativeExperiences.length)];
    state.draft.formative = pick.key;
    render();
  } else if (action === 'pick-aspiration') {
    const pb = PLAYBOOKS[state.draft.playbookId];
    const idx = parseInt(el.value, 10);
    state.draft.aspiration = pb.aspirations[idx];
    render();
  } else if (action === 'pick-formative') {
    state.draft.formative = el.value;
    render();
  } else if (action === 'pick-expert') {
    const skill = el.value;
    const d = state.draft;
    d.skills.expert = skill;
    d.skills.trained = d.skills.trained.filter(function (s) { return s !== skill; });
    render();
  } else if (action === 'pick-trained') {
    const skill = el.value;
    const d = state.draft;
    if (el.checked) {
      if (d.skills.trained.length < 3) d.skills.trained.push(skill);
    } else {
      d.skills.trained = d.skills.trained.filter(function (s) { return s !== skill; });
    }
    render();
  } else if (action === 'pick-ability') {
    state.draft.ability = el.value;
    render();
  } else if (action === 'edit-character') {
    const c = currentCharacter();
    state.draft = draftFromCharacter(c);
    state.wizardEditingId = c.id;
    state.wizardStep = 0;
    state.view = 'wizard';
    render();
  } else if (action === 'delete-character') {
    // window.confirm() is blocked inside the sandboxed artifact frame, so
    // this is a two-click, in-page confirmation instead of a native dialog.
    state.confirmDelete = true;
    render();
  } else if (action === 'cancel-delete') {
    state.confirmDelete = false;
    render();
  } else if (action === 'confirm-delete') {
    const c = currentCharacter();
    if (c) {
      await Store.remove(c.id);
      state.confirmDelete = false;
      state.view = 'home';
      showToast('Thread removed');
      render();
    }
  } else if (action === 'toggle-debility') {
    const key = el.getAttribute('data-key');
    await persistActive(function (c) { c.debilities[key] = !c.debilities[key]; });
  } else if (action === 'karma-inc') {
    await persistActive(function (c) { c.karma = (c.karma || 0) + 1; });
  } else if (action === 'karma-dec') {
    await persistActive(function (c) { c.karma = Math.max(0, (c.karma || 0) - 1); });
  } else if (action === 'cycle-karma-boost') {
    const key = el.getAttribute('data-key');
    await persistActive(function (c) {
      const pb = PLAYBOOKS[c.playbookId];
      cycleKarmaBoost(pb, c, key);
    });
  } else if (action === 'roll') {
    await persistActive(function (c) {
      const pb = PLAYBOOKS[c.playbookId];
      const staged = pb.axisOrder.reduce(function (sum, k) { return sum + (c.karmaBoost[k] || 0); }, 0);
      if (c.karma >= staged) {
        c.karma -= staged;
        pb.axisOrder.forEach(function (k) { c.karmaBoost[k] = 0; });
      }
    });
  } else if (action === 'track-inc' || action === 'track-dec') {
    const kind = el.getAttribute('data-kind');
    await persistActive(function (c) {
      const pb = PLAYBOOKS[c.playbookId];
      const max = pb[kind].max;
      const delta = action === 'track-inc' ? 1 : -1;
      c[kind] = clamp(c[kind] + delta, 0, max);
    });
  } else if (action && action.indexOf('set-') === 0) {
    const kind = action.slice(4); // 'harm' | 'strain'
    const idx = parseInt(el.getAttribute('data-index'), 10);
    await persistActive(function (c) {
      const target = idx + 1;
      c[kind] = c[kind] === target ? idx : target;
    });
  }
});

document.addEventListener('change', function (e) {
  const select = e.target.closest('[data-pool-field]');
  if (select) {
    const field = select.getAttribute('data-pool-field');
    const val = select.value === '' ? null : parseInt(select.value, 10);
    const d = state.draft;
    if (field.indexOf('axis-') === 0) {
      d.axisValues[field.slice(5)] = val;
    } else if (field.indexOf('style-') === 0) {
      d.styleValues[field.slice(6)] = val;
    }
    render();
    return;
  }
  const input = e.target.closest('[data-field]');
  if (input) {
    const field = input.getAttribute('data-field');
    if (state.view === 'wizard') {
      state.draft[field] = input.value;
    } else if (state.view === 'sheet' && field === 'notes') {
      persistActive(function (c) { c.notes = input.value; });
    }
  }
});

document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('[role="button"][data-action]')) {
    e.preventDefault();
    e.target.click();
  }
});

document.addEventListener('input', function (e) {
  const input = e.target.closest('[data-field="name"]');
  if (input && state.view === 'wizard') {
    state.draft.name = input.value;
    // don't full re-render on every keystroke (keeps caret position); just validate footer
    const nextBtn = document.querySelector('[data-action="wizard-next"]');
    if (nextBtn) nextBtn.disabled = !stepValid(state.wizardStep, state.draft, PLAYBOOKS[state.draft.playbookId]);
  }
});

/* ---------------- Init ---------------- */

(async function init() {
  await Store.init();
  Store.subscribe(function (chars) {
    state.characters = chars;
    render();
  });
  Store.subscribeWorld(function (w) {
    state.world = w;
    render();
  });
})();

</script>
</body>
</html>
